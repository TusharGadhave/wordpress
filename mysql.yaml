apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
  labels:
    app: mysql

spec:
  containers:
    - name: mysql
      image: mysql:8.0

      ports:
        - containerPort: 3306

      env:
        - name: MYSQL_ROOT_PASSWORD
          value: "root123"

        - name: MYSQL_DATABASE
          value: "wordpress"

        - name: MYSQL_USER
          value: "wordpress"

        - name: MYSQL_PASSWORD
          value: "wordpress123"

      volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql

  volumes:
    - name: mysql-storage
      persistentVolumeClaim:
        claimName: mysql-pvc
