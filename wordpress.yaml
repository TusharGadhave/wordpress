apiVersion: v1
kind: Pod
metadata:
  name: wordpress-pod
  labels:
    app: wordpress

spec:
  containers:
    - name: wordpress
      image: wordpress:latest

      ports:
        - containerPort: 80

      env:
        - name: WORDPRESS_DB_HOST
          value: "mysql-service:3306"

        - name: WORDPRESS_DB_USER
          value: "wordpress"

        - name: WORDPRESS_DB_PASSWORD
          value: "wordpress123"

        - name: WORDPRESS_DB_NAME
          value: "wordpress"
